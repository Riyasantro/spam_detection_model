[project]
name = "spam-detection-model"
version = "0.1.0"
description = "Spam Email Detection using PyTorch LSTM"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "torch>=1.9.0",
    "matplotlib>=3.4.0",
    "streamlit>=1.15.0",
]

[project.scripts]
train = "train:main"
predict = "predict:main"
